[package]
name = "validatorclock"
version = "2.2.0"
edition = "2024"

[dependencies]
futures = "0.3"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
# Forked because EverX no longer maintains these and TON has moved on: the
# schema has no name for `adnl.address.quic`, and the reader took only the
# first address in a list and only if it was UDP. Both cost validators their
# place on the map. See the `quic-address` branch of each.
adnl = { version = "0.11", features = ["node"], git = "https://github.com/jouliene/ever-adnl.git", branch = "quic-address" }
flate2 = "1"
ever_block = { git = "https://github.com/everx-labs/ever-block.git", tag = "1.11.20", features = ["export_key"] }
ton_api = { git = "https://github.com/jouliene/ever-tl.git", package = "ton_api", branch = "quic-address" }
minik2 = { git = "https://github.com/jouliene/minik2", rev = "3cf2fc733805343c918525ec080b189e2cccfe42" }
rand = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The Tycho network stack, for the chain whose addresses live in its own DHT
# rather than in an ADNL one. It brings QUIC with it and no `tycho-types`, so
# the version this project parses blocks with is untouched.
tycho-crypto = "0.4"
tycho-network = "0.3.12"
tycho-types = { version = "0.3.4", features = ["abi"] }
x509-parser = "0.18"

[dev-dependencies]
# Time that can be moved on rather than waited through: the resolver pauses
# twenty seconds between rounds of second asks, and a test of those rounds
# should not.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
# The DHT stack the node resolver runs on is third-party code parsing what
# strangers send it, and it lives in this process. Unwinding lets a panic
# there end its own thread, which the resolver restarts, instead of taking
# the site down with it.
panic = "unwind"
strip = true
debug = false

